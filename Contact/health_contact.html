<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact Us</title>
        <link rel="stylesheet" href="./health_contact.css">
    </head>
    <body>
        <nav>
            <h1>Health Analysis Census</h1>
            <ul>
                <li><a href="../home/index.html" id="home">Home</a></li>
                <li><a href="../Contact/health_contact.html" id="contact">Contact Us</a></li>
            </ul>
        </nav>
        <h1>Contact Us</h1>
        <p>Feel free to contact us t know more about your conditions and for treatment methods.</p>
        <form id="contactForm">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="condition">Condition</label>
                <input type="text" id="condition" name="condition" required>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" onclick="thankyou()">Submit</button>
        </form>
    </body>
</html>
